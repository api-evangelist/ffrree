x-enrichment-note: 'Enrichment 2026-07-20 (re-verified, evidence strengthened): ffrree.com
  resolves to Afternic nameservers (ns1/ns2.afternic.com) on GoDaddy parking IPs and
  serves a JS redirect to a for-sale lander; DNS has a null MX ("0 .") and "v=spf1 -all",
  i.e. the domain sends no mail. Wildcard DNS makes api./developer./docs. subdomains
  resolve to the same parking IPs, and every path - including /.well-known/* and /openapi.json
  - returns a soft-200 parking page, so none of those are real artifacts and none were
  saved. The host does serve a genuine /llms.txt, but it is GoDaddy''s domain-listing
  blurb, not a company or API document, so it was deliberately NOT captured as an LLMsTxt
  artifact. NEW this pass: the GitHub organization github.com/ffrree ("Free", created
  2015-02-02, blog https://ffrree.com) does exist and is verifiably this company, but
  7 of its 8 public repos are forks of third-party libraries and the last push was 2016-09-08
  - no first-party product code, no OpenAPI, no spec to ground any artifact on. No npm
  or PyPI packages exist under this name. Domain-security probing was deliberately skipped
  because it would measure GoDaddy''s parking infrastructure, not the company. No artifacts
  could honestly be searched, generated, or derived. No fabrication.'
