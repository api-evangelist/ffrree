name: ffrree
description: >-
  ffrree (GitHub organization "Free") was an early-stage, Slow Ventures-backed
  mobile software company active around 2015-2016. Its only public engineering footprint
  is a GitHub organization of eight repositories - seven of them forks of third-party
  iOS and backend libraries (AFNetworking, jot, TheAmazingAudioEngine, protobuf-objc,
  redis-py, slack) plus an original CocoaPods "Specs" podspec mirror - with all repository
  activity ceasing in 2016. The company is defunct: ffrree.com now serves a GoDaddy/Afternic
  domain-for-sale parking lander, and there is no product, developer portal, documentation,
  SDK, or API surface of any kind. Retained in the API Evangelist network as a verified
  dead lead rather than deleted, so the slug is not re-researched from scratch.
